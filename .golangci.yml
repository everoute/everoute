version: "2"
run:
  issues-exit-code: 1
linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - dogsled
    - dupl
    - errcheck
    - funlen
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    depguard:
      rules:
        main:
          files:
            - $all
            - '!$test'
          allow:
            - $gostd
            - github.com
            - k8s.io
            - sigs.k8s.io
    errcheck:
      exclude-functions:
        - fmt:.*
        - io/ioutil:^Read.*
        - io:Close
    funlen:
      lines: 100
      statements: 80
    lll:
      line-length: 170
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - .*_test.go$
      - plugin/tower/pkg/server/fake/graph/resolver/query.resolvers.go
      - plugin/tower/pkg/server/fake/graph/resolver/types.resolvers.go
      - tests/e2e
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - .*_test.go$
      - plugin/tower/pkg/server/fake/graph/resolver/query.resolvers.go
      - plugin/tower/pkg/server/fake/graph/resolver/types.resolvers.go
      - tests/e2e
      - third_party$
      - builtin$
      - examples$
